<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 16 1180 474" font-family="Helvetica, Arial, sans-serif">
    <rect width="1180" height="490" fill="#ffffff"/>

    <!-- Pharmaceutical lane -->
    <text x="30" y="40" font-size="12" font-weight="600" fill="#374151">Pharmaceutical</text>

    <rect x="30" y="52" width="150" height="58" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
    <text x="105" y="76" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Formula</text>
    <text x="105" y="94" text-anchor="middle" font-size="10.5" fill="#374151">version X</text>

    <line x1="180" y1="81" x2="206" y2="81" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="210" y="52" width="150" height="58" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="285" y="76" text-anchor="middle" font-size="13" font-weight="600" fill="#4c1d95">Manufacturing run</text>
    <text x="285" y="94" text-anchor="middle" font-size="10.5" fill="#5b21b6">one run, one lot</text>

    <line x1="360" y1="81" x2="386" y2="81" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="390" y="52" width="150" height="58" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="465" y="76" text-anchor="middle" font-size="13" font-weight="600" fill="#4c1d95">Lot</text>
    <text x="465" y="94" text-anchor="middle" font-size="10.5" fill="#5b21b6">lot number L1</text>

    <line x1="540" y1="81" x2="566" y2="81" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="570" y="52" width="150" height="58" rx="8" fill="#fefce8" stroke="#a16207" stroke-width="1.5"/>
    <text x="645" y="76" text-anchor="middle" font-size="13" font-weight="600" fill="#713f12">Quality control</text>
    <text x="645" y="94" text-anchor="middle" font-size="10.5" fill="#854d0e">releases lot L1</text>

    <line x1="720" y1="81" x2="746" y2="81" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="750" y="52" width="150" height="58" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
    <text x="825" y="76" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12">Distribution</text>
    <text x="825" y="94" text-anchor="middle" font-size="10.5" fill="#9a3412">lot L1</text>

    <!-- Second run of the same formula -->
    <line x1="105" y1="110" x2="206" y2="150" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="210" y="128" width="150" height="48" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="285" y="148" text-anchor="middle" font-size="13" font-weight="600" fill="#4c1d95">Second run</text>
    <text x="285" y="165" text-anchor="middle" font-size="10.5" fill="#5b21b6">same formula version X</text>

    <line x1="360" y1="152" x2="386" y2="152" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="390" y="128" width="150" height="48" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="465" y="148" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">Lot L2</text>
    <text x="465" y="165" text-anchor="middle" font-size="10.5" fill="#991b1b">same label, not released</text>

    <!-- Recall -->
    <path d="M 825 110 V 150 H 660 V 114" fill="none" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-green)"/>
    <text x="580" y="164" font-size="10.5" fill="#065f46">if a later lot fails:</text>
    <text x="580" y="178" font-size="10.5" fill="#065f46">back to lot L1, by its number, released again</text>

    <!-- Correspondence between the lanes -->
    <line x1="105" y1="186" x2="105" y2="234" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="285" y1="186" x2="285" y2="234" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="465" y1="186" x2="465" y2="234" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="645" y1="186" x2="645" y2="234" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="825" y1="186" x2="825" y2="234" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Pipeline lane -->
    <text x="30" y="228" font-size="12" font-weight="600" fill="#374151">Pipeline</text>

    <rect x="30" y="240" width="150" height="58" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
    <text x="105" y="264" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Commit C</text>
    <text x="105" y="282" text-anchor="middle" font-size="10.5" fill="#374151">the code</text>

    <line x1="180" y1="269" x2="206" y2="269" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="210" y="240" width="150" height="58" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="285" y="264" text-anchor="middle" font-size="13" font-weight="600" fill="#4c1d95">Build</text>
    <text x="285" y="282" text-anchor="middle" font-size="10.5" fill="#5b21b6">one per run</text>

    <line x1="360" y1="269" x2="386" y2="269" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="390" y="240" width="150" height="58" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="465" y="264" text-anchor="middle" font-size="13" font-weight="600" fill="#4c1d95">Image</text>
    <text x="465" y="282" text-anchor="middle" font-size="10.5" fill="#5b21b6">digest D1, tag C</text>

    <line x1="540" y1="269" x2="566" y2="269" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="570" y="240" width="150" height="58" rx="8" fill="#fefce8" stroke="#a16207" stroke-width="1.5"/>
    <text x="645" y="264" text-anchor="middle" font-size="13" font-weight="600" fill="#713f12">QA + approval</text>
    <text x="645" y="282" text-anchor="middle" font-size="10.5" fill="#854d0e">smoke test, reviewer</text>

    <line x1="720" y1="269" x2="746" y2="269" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="750" y="240" width="150" height="58" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
    <text x="825" y="264" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12">PROD</text>
    <text x="825" y="282" text-anchor="middle" font-size="10.5" fill="#9a3412">digest D1, not rebuilt</text>

    <!-- Rerun of the same commit -->
    <line x1="105" y1="298" x2="206" y2="343" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="210" y="316" width="150" height="58" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="285" y="340" text-anchor="middle" font-size="13" font-weight="600" fill="#4c1d95">Rerun</text>
    <text x="285" y="358" text-anchor="middle" font-size="10.5" fill="#5b21b6">same commit C</text>

    <line x1="360" y1="345" x2="386" y2="345" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="390" y="316" width="150" height="58" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="465" y="336" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">Image, digest D2</text>
    <text x="465" y="352" text-anchor="middle" font-size="10.5" fill="#991b1b">tag C now points here</text>
    <text x="465" y="366" text-anchor="middle" font-size="10.5" fill="#991b1b">never deployed</text>

    <!-- Rollback -->
    <path d="M 825 298 V 338 H 660 V 302" fill="none" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-green)"/>
    <text x="580" y="352" font-size="10.5" fill="#065f46">if a later release fails:</text>
    <text x="580" y="366" font-size="10.5" fill="#065f46">back to digest D1, through QA and approval again</text>

    <!-- Back by tag -->
    <path d="M 870 298 V 404 H 465 V 380" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/>
    <line x1="652" y1="396" x2="668" y2="412" stroke="#b91c1c" stroke-width="2"/>
    <line x1="668" y1="396" x2="652" y2="412" stroke="#b91c1c" stroke-width="2"/>
    <text x="480" y="424" font-size="10.5" fill="#7f1d1d">back by tag: reaches the last build of C, which no one released</text>

    <!-- Where it breaks -->
    <rect x="940" y="52" width="210" height="322" rx="12" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="1045" y="76" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Where it breaks</text>
    <text x="1045" y="94" text-anchor="middle" font-size="10.5" fill="#374151">a kit of two pieces</text>

    <rect x="960" y="106" width="170" height="44" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="1045" y="125" text-anchor="middle" font-size="12" font-weight="600" fill="#4c1d95">Backend</text>
    <text x="1045" y="141" text-anchor="middle" font-size="10.5" fill="#5b21b6">its own lot: digest</text>

    <rect x="960" y="160" width="170" height="44" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="1045" y="179" text-anchor="middle" font-size="12" font-weight="600" fill="#4c1d95">Frontend</text>
    <text x="1045" y="195" text-anchor="middle" font-size="10.5" fill="#5b21b6">its own lot: digest</text>

    <text x="956" y="232" font-size="10.5" fill="#374151">A rollback validates each</text>
    <text x="956" y="247" font-size="10.5" fill="#374151">piece on its own: two pieces</text>
    <text x="956" y="262" font-size="10.5" fill="#374151">never tested together pass.</text>
    <text x="956" y="292" font-size="10.5" fill="#374151">A deploy delivers them one</text>
    <text x="956" y="307" font-size="10.5" fill="#374151">after the other: if the second</text>
    <text x="956" y="322" font-size="10.5" fill="#374151">fails, the kit is left mixed.</text>

    <!-- Cross-references -->
    <text x="30" y="458" font-size="11" fill="#4b5563">one build, the digest QA tested goes to PROD &#8594; ADR-009; ADR-007 (amendment of 2026-11-11) · rollback &#8594; ADR-007 (amendment of 2026-11-23)</text>
    <text x="30" y="475" font-size="11" fill="#4b5563">the kit: rollback.yml validates each digest on its own; ci.yml deploys the backend, then the frontend</text>

    <defs>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
        </marker>
        <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8 Z" fill="#047857"/>
        </marker>
        <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8 Z" fill="#b91c1c"/>
        </marker>
    </defs>
</svg>
