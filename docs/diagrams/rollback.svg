<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 720" font-family="Helvetica, Arial, sans-serif">
    <rect width="680" height="720" fill="#ffffff"/>

    <!-- Input -->
    <rect x="190" y="24" width="300" height="48" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
    <text x="340" y="45" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">rollback.yml, run by hand from main</text>
    <text x="340" y="62" text-anchor="middle" font-size="10.5" fill="#374151">inputs: a backend digest and a frontend digest</text>

    <line x1="340" y1="72" x2="340" y2="100" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Validation -->
    <rect x="30" y="100" width="620" height="318" rx="12" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="46" y="120" font-size="11" fill="#4b5563">Validate, for each digest: read-only, before any deploy hook is called</text>

    <rect x="60" y="134" width="260" height="44" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
    <text x="190" y="161" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">1 · Form: sha256:&lt;64 hex&gt;</text>

    <line x1="320" y1="156" x2="356" y2="156" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="360" y="134" width="260" height="44" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
    <text x="490" y="161" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">2 · The image exists in ghcr.io</text>

    <text x="46" y="208" font-size="11" fill="#4b5563">3 · Deployments to prod from main, newest first, as the GitHub Deployments API lists them</text>

    <rect x="60" y="222" width="320" height="50" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="220" y="243" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">Created by rollback.yml</text>
    <text x="220" y="261" text-anchor="middle" font-size="10.5" fill="#991b1b">records main's commit, not the image's</text>

    <line x1="380" y1="247" x2="436" y2="247" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="440" y="225" width="180" height="44" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="530" y="252" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">not counted</text>

    <line x1="220" y1="272" x2="220" y2="294" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="228" y="288" font-size="10" fill="#4b5563">next deployment</text>

    <rect x="60" y="294" width="320" height="64" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
    <text x="220" y="316" text-anchor="middle" font-size="13" font-weight="600" fill="#064e3b">Created by ci.yml, successful</text>
    <text x="220" y="334" text-anchor="middle" font-size="10.5" fill="#065f46">the commit-SHA tag of its commit</text>
    <text x="220" y="349" text-anchor="middle" font-size="10.5" fill="#065f46">points to this digest?</text>

    <line x1="380" y1="326" x2="436" y2="326" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="408" y="318" text-anchor="middle" font-size="10" fill="#4b5563">yes</text>

    <rect x="440" y="304" width="180" height="44" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
    <text x="530" y="331" text-anchor="middle" font-size="13" font-weight="600" fill="#064e3b">accepted</text>

    <rect x="60" y="374" width="560" height="30" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1"/>
    <text x="340" y="394" text-anchor="middle" font-size="11" fill="#7f1d1d">Check 1 or 2 fails, or no counted deployment matches: the run fails, and no hook is called</text>

    <line x1="340" y1="418" x2="340" y2="446" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="348" y="437" font-size="10" fill="#4b5563">both digests accepted</text>

    <!-- Same path as the pipeline's deploy -->
    <rect x="190" y="446" width="300" height="56" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
    <text x="340" y="469" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12">Roll back QA (Render)</text>
    <text x="340" y="487" text-anchor="middle" font-size="10.5" fill="#9a3412">deploy hook by digest + smoke test</text>

    <line x1="340" y1="502" x2="340" y2="528" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="190" y="528" width="300" height="50" rx="8" fill="#fefce8" stroke="#a16207" stroke-width="1.5"/>
    <text x="340" y="549" text-anchor="middle" font-size="13" font-weight="600" fill="#713f12">Manual approval</text>
    <text x="340" y="566" text-anchor="middle" font-size="10.5" fill="#854d0e">prod environment, required reviewer</text>

    <line x1="340" y1="578" x2="340" y2="604" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="190" y="604" width="300" height="56" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
    <text x="340" y="627" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12">Roll back PROD (Render)</text>
    <text x="340" y="645" text-anchor="middle" font-size="10.5" fill="#9a3412">same digests + smoke test · nothing rebuilt</text>

    <!-- Cross-reference -->
    <text x="30" y="700" font-size="11" fill="#4b5563">validation, its limits and the alternatives rejected &#8594; ADR-007 (amendment of 2026-11-23)</text>

    <defs>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
        </marker>
    </defs>
</svg>
